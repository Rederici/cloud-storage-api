[project]
name = "cloud-storage-api"
version = "0.1.0"
description = ""
authors = [
    { name = "Ivan", email = "rclisbs@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.138.0,<0.141.2",
    "uvicorn>=0.49.0,<0.52.5",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary]>=3.3.4",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings[toml] (>=2.14.2,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "cryptography>=49.0.0,<50.0.2",
    "authlib (>=1.7.2,<2.0.0)",
    "cashews[redis] (>=7.5.0,<8.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "types-aiobotocore[s3] (>=3.7.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "stream-zip>=0.0.84",
    "starlette>=1.3.1",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.19,<0.16.0)",
    "basedpyright>=1.40.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "asgi-lifespan (>=2.1.0,<3.0.0)",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "commitizen>=4.18.0",
]

[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "ASYNC", # async pitfalls
    "LOG", # logging
    "G", # logging format issues
    "TID", # import rules
    "SIM", # code simplification
    "RUF", # ruff specific
]
ignore = [
    "B008", # argument func call
]
isort = { known-first-party = ["src"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
executionEnvironments = [{ root = "." }]
typeCheckingMode = "standard"
include = ["src/", "tests/"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/"]
omit = ["tests/", "migrations/"]

[tool.coverage.report]
omit = ["tests/", "migrations/"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
