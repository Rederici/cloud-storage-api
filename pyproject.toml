[project]
name = "cloud-storage"
version = "0.1.0"
description = ""
authors = [
    { name = "Ivan", email = "rclisbs@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2[binary] (>=2.9.12,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings[toml] (>=2.14.2,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
    "commitizen (>=4.16.4,<5.0.0)",
    "cashews[diskcache,redis] (>=7.5.0,<8.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "boto3 (>=1.43.40,<2.0.0)",
    "boto3-stubs[s3] (>=1.43.40,<2.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.19,<0.16.0)",
    "pyrefly (>=1.1.1,<2.0.0)",
    "testcontainers[minio,postgres,redis] (>=4.14.2,<5.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "ASYNC", # async pitfalls
    "LOG", # logging
    "G", # logging format issues
    "TID", # import rules
    "SIM", # code simplification
    "RUF", # ruff specific
]
ignore = [
    "B008", # argument func call
]
isort = { known-first-party = ["src"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
search-path = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/"]
omit = [
    "tests/",
    "src/migrations/"
]
